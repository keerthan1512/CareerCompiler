[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-compiler-job-intelligence"
version = "0.1.0"
description = "Job Description Intelligence Layer for CareerCompiler"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "career-compiler-llm-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
